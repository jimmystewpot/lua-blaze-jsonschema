name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lua:
    strategy:
      fail-fast: false
      matrix:
        os: [linux]
        lua: [lua=5.3, lua=5.4]
        include:
          - os: linux
            runner: ubuntu-latest
        exclude:
          - os: linux
            lua: luajit=2.0
          - os: linux
            lua: luajit=2.1
    name: ${{ matrix.os }} (${{ matrix.lua }})
    runs-on: ${{ matrix.runner }}
    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure submodules are present
        if: always()
        run: |
          git submodule update --init --recursive
      - name: version exporter
        id: version
        run: |
          LUA_VERSION=$(echo "${{ matrix.lua }}" | sed 's/^[^=]*=//')
          echo "lua_version=${LUA_VERSION}" >> $GITHUB_OUTPUT

      - name: Install Lua and dependencies on Linux
        if: runner.os == 'linux'
        run: |
          case "${{ matrix.lua }}" in
            lua=5.3) sudo apt-get update && sudo apt-get install -y libreadline-dev libpcre2-dev cmake build-essential lua5.3 luarocks lua5.3-dev ;;
            lua=5.4) sudo apt-get update && sudo apt-get install -y libreadline-dev libpcre2-dev cmake build-essential lua5.4 luarocks lua5.4-dev ;;  # Use default if available
            luajit=2.0|luajit=2.1) sudo apt-get update && sudo apt-get install -y libreadline-dev libpcre2-dev cmake build-essential luajit luarocks luajit-dev ;;
          esac

      - name: Install luarocks dependencies
        if: always()
        run: |
          sudo -E luarocks --lua-version=${{ steps.version.outputs.lua_version }} install busted
          sudo -E luarocks --lua-version=${{ steps.version.outputs.lua_version }} install dkjson
          sudo -E luarocks --lua-version=${{ steps.version.outputs.lua_version }} install lrexlib-pcre2
          sudo -E luarocks --lua-version=${{ steps.version.outputs.lua_version }} install lua-schema

      - name: Build lua-blaze
        if: always()
        run: |
          case "${{ runner.os }}" in
            Linux|linux)
              LUA_VER=${{ steps.version.outputs.lua_version }}
              export LUA_INCDIR=/usr/include/lua${LUA_VER}
              export LUA_LIBFILE=$(ls -1 /usr/lib/x86_64-linux-gnu/liblua${LUA_VER}.so* 2>/dev/null | head -n 1)
              echo "Debug: LUA_INCDIR=${LUA_INCDIR}"
              echo "Debug: LUA_LIBFILE=${LUA_LIBFILE}"
              if [ -z "${LUA_INCDIR}" ] || [ ! -d "${LUA_INCDIR}" ]; then
                echo "Error: LUA_INCDIR is not set to a valid directory: '${LUA_INCDIR}'"
                exit 1
              fi
              if [ -z "${LUA_LIBFILE}" ] || [ ! -f "${LUA_LIBFILE}" ]; then
                echo "Error: LUA_LIBFILE is not set to a valid file: '${LUA_LIBFILE}'"
                exit 1
              fi
              sudo -E luarocks --lua-version=${{ steps.version.outputs.lua_version }} make --force
              ;;
            *)
              sudo -E luarocks make
              ;;
          esac
      - name: Library Version Tests
        if: always()
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            export LUA=/usr/bin/lua${{ steps.version.outputs.lua_version }}
          else
            export LUA=$(which lua)
          fi
          busted --lua=/usr/bin/lua${{ steps.version.outputs.lua_version }} --verbose spec/info_spec.lua
      - name: JSON Schema test suite
        if: always()
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            export LUA=/usr/bin/lua${{ steps.version.outputs.lua_version }}
          else
            export LUA=$(which lua)
          fi
          busted --lua=/usr/bin/lua${{ steps.version.outputs.lua_version }} --verbose spec/luablaze_spec.lua
      - name: Performance Tests
        if: always()
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            export LUA=/usr/bin/lua${{ steps.version.outputs.lua_version }}
          else
            export LUA=$(which lua)
          fi
          busted --lua=/usr/bin/lua${{ steps.version.outputs.lua_version }} --verbose spec/perf_spec.lua
      - name: Security related tests
        if: always()
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            export LUA=/usr/bin/lua${{ steps.version.outputs.lua_version }}
          else
            export LUA=$(which lua)
          fi
          busted --cpath=./build/?.so --lua=/usr/bin/lua${{ steps.version.outputs.lua_version }} --verbose spec/configurable_recursion_spec.lua
          busted --cpath=./build/?.so --lua=/usr/bin/lua${{ steps.version.outputs.lua_version }} --verbose spec/overflow_protection_spec.lua
          busted --cpath=./build/?.so --lua=/usr/bin/lua${{ steps.version.outputs.lua_version }} --verbose spec/recursion_limits_spec.lua

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure submodules are present
        run: |
          git submodule update --init --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev libpcre2-dev cmake build-essential lua5.4 luarocks lua5.4-dev lcov

      - name: Install test dependencies
        run: |
          sudo -E luarocks --lua-version=5.4 install busted
          sudo -E luarocks --lua-version=5.4 install dkjson
          sudo -E luarocks --lua-version=5.4 install lrexlib-pcre2
          sudo -E luarocks --lua-version=5.4 install lua-schema

      - name: Build with Coverage
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLUABLAZE_ENABLE_COVERAGE=ON
          cmake --build build --parallel

      - name: Run Test Suite
        run: |
          busted --cpath=./build/?.so --lua=/usr/bin/lua5.4 spec/

      - name: Generate Coverage Report
        run: |
          lcov --capture --directory build --output-file coverage.raw --ignore-errors mismatch,gcov,inconsistent 2>/dev/null || lcov --capture --directory build --output-file coverage.raw
          lcov --extract coverage.raw "*/src/*" --output-file coverage.info --ignore-errors mismatch,gcov,inconsistent 2>/dev/null || lcov --extract coverage.raw "*/src/*" --output-file coverage.info
          lcov --list coverage.info 2>/dev/null || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
          fail_ci_if_error: false